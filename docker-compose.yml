version: '3.9'

services:

  backend:
    build: .
    container_name: taskflow_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db

    env_file:
      - .env

  db:
    image: postgres:15

    container_name: taskflow_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_db

    ports:
       - "5433:5432"
